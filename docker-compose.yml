services:
  tradingbot-worker:
    image: tradingbot-worker:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradingbot-worker
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - Database__ConnectionString=Host=postgres;Database=tradingbot;Username=postgres;Password=${DB_PASSWORD:-postgres}
      - Exchange__ApiKey=${BYBIT_API_KEY}
      - Exchange__ApiSecret=${BYBIT_API_SECRET}
      - Security__EncryptionKey=${ENCRYPTION_KEY}
      - Telegram__ApiId=${TELEGRAM_API_ID:-}
      - Telegram__ApiHash=${TELEGRAM_API_HASH:-}
      - Telegram__PhoneNumber=${TELEGRAM_PHONE_NUMBER:-}
      - Telegram__SessionPath=${TELEGRAM_SESSION_PATH:-/app/data/telegram/session}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}
    expose:
      - "80"
    volumes:
      - botdata:/app/data
    depends_on:
      - postgres
      - redis
    networks:
      - tradingbot-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: tradingbot-dashboard
    expose:
      - "3000"
    environment:
      - API_PROXY_TARGET=http://tradingbot-worker
    depends_on:
      - tradingbot-worker
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - tradingbot-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: tradingbot-nginx
    ports:
      - "80:80"
    expose:
      - "80"
    depends_on:
      - dashboard
      - tradingbot-worker
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tradingbot-network

  postgres:
    image: postgres:16-alpine
    container_name: tradingbot-postgres
    environment:
      POSTGRES_DB: tradingbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tradingbot-network

  redis:
    image: redis:7-alpine
    container_name: tradingbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - tradingbot-network

volumes:
  pgdata:
  redisdata:
  botdata:

networks:
  tradingbot-network:
    driver: bridge
