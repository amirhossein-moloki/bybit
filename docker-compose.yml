version: '3.8'

services:
  tradingbot-worker:
    image: tradingbot-worker:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradingbot-worker
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Database__ConnectionString=Host=postgres;Database=tradingbot;Username=postgres;Password=${DB_PASSWORD:-postgres}
      - Exchange__ApiKey=${BYBIT_API_KEY}
      - Exchange__ApiSecret=${BYBIT_API_SECRET}
      - Security__EncryptionKey=${ENCRYPTION_KEY}
      - Telegram__SessionPath=/app/data/telegram/session
    ports:
      - "5000:80"
    volumes:
      - botdata:/app/data
    depends_on:
      - postgres
      - redis
    networks:
      - tradingbot-network

  tradingbot-dashboard:
    image: tradingbot-dashboard:latest
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: tradingbot-dashboard
    restart: unless-stopped
    environment:
      - PORT=3000
      - API_PROXY_TARGET=${API_PROXY_TARGET:-http://tradingbot-worker:80}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      - tradingbot-worker
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - tradingbot-network

  postgres:
    image: postgres:16-alpine
    container_name: tradingbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tradingbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tradingbot-network

  redis:
    image: redis:7-alpine
    container_name: tradingbot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - tradingbot-network

volumes:
  pgdata:
  redisdata:
  botdata:

networks:
  tradingbot-network:
    driver: bridge
