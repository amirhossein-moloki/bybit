services:
  tradingbot-worker:
    image: tradingbot-worker:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradingbot-worker
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080
      - Database__ConnectionString=${DATABASE_CONNECTION:-Host=postgres;Database=tradingbot;Username=postgres;Password=${DB_PASSWORD:-}}
      - DATABASE_CONNECTION=${DATABASE_CONNECTION:-Host=postgres;Database=tradingbot;Username=postgres;Password=${DB_PASSWORD:-}}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - Exchange__ApiKey=${BYBIT_API_KEY:-}
      - Exchange__ApiSecret=${BYBIT_API_SECRET:-${BYBIT_SECRET_KEY:-}}
      - Exchange__DemoApiKey=${BYBIT_DEMO_API_KEY:-}
      - Exchange__DemoApiSecret=${BYBIT_DEMO_API_SECRET:-}
      - Exchange__MainnetApiKey=${BYBIT_MAINNET_API_KEY:-}
      - Exchange__MainnetApiSecret=${BYBIT_MAINNET_API_SECRET:-}
      - Exchange__Environment=${BYBIT_ENVIRONMENT:-Demo}
      - BYBIT_API_KEY=${BYBIT_API_KEY:-}
      - BYBIT_API_SECRET=${BYBIT_API_SECRET:-${BYBIT_SECRET_KEY:-}}
      - BYBIT_DEMO_API_KEY=${BYBIT_DEMO_API_KEY:-}
      - BYBIT_DEMO_API_SECRET=${BYBIT_DEMO_API_SECRET:-}
      - BYBIT_MAINNET_API_KEY=${BYBIT_MAINNET_API_KEY:-}
      - BYBIT_MAINNET_API_SECRET=${BYBIT_MAINNET_API_SECRET:-}
      - BYBIT_ENVIRONMENT=${BYBIT_ENVIRONMENT:-Demo}
      - BYBIT_PROXY_URL=${BYBIT_PROXY_URL:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - Security__EncryptionKey=${ENCRYPTION_KEY:-}
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN:-}
      - Security__DashboardToken=${DASHBOARD_TOKEN:-}
      - Security__AllowedTelegramChatIds=${Security__AllowedTelegramChatIds:-}
      - Telegram__ApiId=${TELEGRAM_API_ID:-}
      - Telegram__ApiHash=${TELEGRAM_API_HASH:-}
      - Telegram__PhoneNumber=${TELEGRAM_PHONE_NUMBER:-}
      - Telegram__SessionPath=${TELEGRAM_SESSION_PATH:-/app/data/telegram/session}
      - Telegram__BotToken=${TELEGRAM_BOT_TOKEN:-}
      - Telegram__ProxyUrl=${TELEGRAM_PROXY_URL:-}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}
      - TELEGRAM_PHONE_NUMBER=${TELEGRAM_PHONE_NUMBER:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_PROXY_URL=${TELEGRAM_PROXY_URL:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - AI__Provider=${AI__Provider:-Mock}
      - AI__ApiKey=${AI__ApiKey:-}
      - AI__Endpoint=${AI__Endpoint:-https://openrouter.ai/api/v1/chat/completions}
      - AI__Model=${AI__Model:-openrouter/auto}
      - Notification__Telegram__BotToken=${TELEGRAM_BOT_TOKEN:-}
      - Notification__Telegram__ChatId=${TELEGRAM_CHAT_ID:-}
      - NOTIFICATIONS_DISABLED=${NOTIFICATIONS_DISABLED:-false}
    expose:
      - "8080"
    volumes:
      - botdata:/app/data
    depends_on:
      - postgres
      - redis
    networks:
      - tradingbot-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: tradingbot-dashboard
    expose:
      - "3000"
    environment:
      - API_PROXY_TARGET=${API_PROXY_TARGET:-http://tradingbot-worker:8080}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    depends_on:
      - tradingbot-worker
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/login', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - tradingbot-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: tradingbot-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
    expose:
      - "80"
    depends_on:
      - dashboard
      - tradingbot-worker
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tradingbot-network

  postgres:
    image: postgres:16-alpine
    container_name: tradingbot-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tradingbot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tradingbot-network

  redis:
    image: redis:7-alpine
    container_name: tradingbot-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    networks:
      - tradingbot-network

volumes:
  pgdata:
  redisdata:
  botdata:

networks:
  tradingbot-network:
    driver: bridge
